# Elastic Beanstalk terminates client connections at nginx and proxies to the
# app container. The default proxy does not forward the Upgrade/Connection
# headers a WebSocket handshake needs, so /ws/* would fail. This server-context
# include (EB includes conf.d/elasticbeanstalk/*.conf inside the server block)
# adds a more-specific location for the WebSocket routes.
#
# On the AL2023 Docker platform the container's port (3001) is EXPOSEd but not
# published to the host, so EB proxies to the container over the Docker bridge
# network (172.17.0.2), not 127.0.0.1. We target the same address and add the
# upgrade headers. The single app container reliably gets bridge IP 172.17.0.2.
location /ws/ {
    proxy_pass          http://172.17.0.2:3001;
    proxy_http_version  1.1;
    proxy_set_header    Upgrade $http_upgrade;
    proxy_set_header    Connection "upgrade";
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
}
