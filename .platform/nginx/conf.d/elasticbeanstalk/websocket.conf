# Elastic Beanstalk terminates client connections at nginx and proxies to the
# app container. The default proxy does not forward the Upgrade/Connection
# headers a WebSocket handshake needs, so /ws/* would fail. This server-context
# include (EB includes conf.d/elasticbeanstalk/*.conf inside the server block)
# adds a more-specific location for the WebSocket routes that passes them through.
#
# proxy_pass targets the container on the port the Dockerfile EXPOSEs (3001). If
# the first deploy's WS handshake fails, confirm the app's published host port
# and adjust the port here.
location /ws/ {
    proxy_pass          http://127.0.0.1:3001;
    proxy_http_version  1.1;
    proxy_set_header    Upgrade $http_upgrade;
    proxy_set_header    Connection "upgrade";
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
}
