name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @workbench/types build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r exec tsc --noEmit

      - name: Unit + integration tests (with coverage gate)
        run: pnpm --filter @workbench/backend test:coverage

      - name: Eval metrics tests
        run: pnpm --filter @workbench/eval test

      - name: Build all packages
        run: pnpm build

      - name: Eval suite (offline harness check)
        run: pnpm eval:run

  e2e:
    name: end-to-end (Playwright, mock providers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @workbench/types build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E (fake mic, no API keys -> mock providers)
        run: pnpm test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
